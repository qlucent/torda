[package]
name = "torda-mod-corr"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "torda_mod_corr"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
torda-core = { path = "../../core" }
torda-ocsf = { path = "../../ocsf" }
# The two single-sensor modules — reused ONLY for their public pure `assess`
# rulesets (process + network). corr owns only the pid-join + correlated rule;
# it never re-implements their port / lolbin / path classification.
torda-mod-procmon = { path = "../procmon" }
torda-mod-netmon = { path = "../netmon" }
torda-mod-filemon = { path = "../filemon" }

[dev-dependencies]
torda-substrate = { path = "../../substrate" }

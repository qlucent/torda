[package]
name = "torda-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "torda_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
torda-ocsf = { path = "../ocsf" }

[dev-dependencies]
# `test-util` enables tokio's paused-time clock (`start_paused`) so the
# `run_periodic` scheduler tests are deterministic (no wall-clock flakiness).
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

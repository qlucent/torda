# Torda benchmark — the ATT&CK test registry (the heart of the harness).
#
# Each [[case]] is ONE atomic test. Ground truth is DECLARED here, never inferred:
# `expects` says which OCSF class + torda rule SHOULD fire within `within_seconds`.
# Scoring compares captured OCSF against this — never a tool's own opinion.
#
# tier "A" = detections torda claims today (validate the tool; produce coverage %).
# tier "B" = techniques peer tools catch that torda historically didn't (the honest
#            gap). expected_result "miss"; a hit is scored GAP_CLOSED.
#
# Rule names are the REAL torda identifiers (verified against
# crates/modules/{procmon,netmon,filemon,corr}); keep them in sync with the code.

# ─────────────────────────── Tier A — should fire today ───────────────────────────

[[case]]
id = "lolbin-basic"
attack_technique = "T1059"
attack_tactic = "execution"
name = "Living-off-the-land binary executed"
platform = "linux"
tier = "A"
atomic = "atomics/linux/lolbin_basic.sh"
cleanup = "atomics/linux/noop_cleanup.sh"
expects = { ocsf_class = 1007, rule = "lolbin", within_seconds = 5 }
expected_result = "hit"
notes = "procmon LOLBINS family (base64/xxd/nc/...)."


[package]
name = "torda-ingest"
edition.workspace = true
# FSL-1.1-ALv2 (source-available, non-compete, -> Apache-2.0 after 2 years), NOT the
# Apache-2.0 workspace default: this is the ingest/scoring pipeline moat. See LICENSING.md.
license-file = "LICENSE"
version.workspace = true

[lib]
name = "torda_ingest"
path = "src/lib.rs"

[[bin]]
name = "torda-ingest"
path = "src/main.rs"

# The findings processor for the tryable path: OCSF detection events ->
# scored, fix-grouped findings NDJSON (reuses the findings engine as-is).
[[bin]]
name = "findings-from-events"
path = "src/bin/findings-from-events.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
torda-ocsf = { path = "../../crates/ocsf" }
torda-findings = { path = "../../crates/findings" }
torda-findings-engine = { path = "../findings-engine" }
torda-compliance = { path = "../../crates/compliance" }
torda-remediation = { path = "../remediation" }
torda-control-plane = { path = "../control-plane" }
# FSL issuer surface (ControlPlaneClient / ResultCorrelator / establish_session + the
# file-loaded mTLS client config). ingest is itself FSL, so a normal dep here is fine
# (FSL -> FSL); the mtls-channel-demo + remediation-demo bins drive the full client channel.
torda-control-server = { path = "../control-server" }
torda-transport = { path = "../transport" }
# mtls-channel-demo: real mutual-TLS carrier for the control channel (demo-only).
torda-transport-tls = { path = "../transport-tls" }
# Named directly by the demo only for `rustls::pki_types::ServerName` (server-name for the
# server cert's "localhost" SAN); matches the transport-tls feature set (ring provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# remediation-demo section [10] only: builds hex key-file strings from seeds/pubkeys to
# exercise the ops-provisioned file load path (from_key_file / load_trust_dir). Workspace dep.
hex = { workspace = true }

[dev-dependencies]
# process_e2e / network_e2e integration tests ONLY: run the REAL procmon/netmon
# modules on a REAL StubBus substrate to prove substrate->module->OCSF->ingest end
# to end. Test-only — never a production dependency (a module never appears
# upstream of torda-ingest's [dependencies]).
tokio = { workspace = true }
torda-core = { path = "../../crates/core" }
torda-substrate = { path = "../../crates/substrate" }
torda-mod-procmon = { path = "../../crates/modules/procmon" }
torda-mod-netmon = { path = "../../crates/modules/netmon" }
# correlation_e2e integration test ONLY: runs the REAL corr module on a REAL
# StubBus substrate to prove substrate->module->OCSF->ingest end to end.
torda-mod-corr = { path = "../../crates/modules/corr" }

# Collector-side Vector config for the SECURE profile: same file->OpenSearch
# pipelines as vector.toml, but shipping over HTTPS with basic auth as the
# least-privilege `torda-ingest` user (provisioned by config/security-bootstrap.sh
# — NOT admin). The password is interpolated from OPENSEARCH_INGEST_PASSWORD,
# passed to the vector container by docker-compose.secure.yml.
#
# verify_certificate = false because the profile uses OpenSearch's self-signed
# demo certs. For production, mount your CA and set verify_certificate = true with
# a tls.ca_file.

[sources.ua]
type = "file"
include = ["/ingest/events.ndjson"]
read_from = "beginning"

[transforms.parse_ocsf]
type = "remap"
inputs = ["ua"]
source = '''
. = parse_json!(.message)
.@timestamp = from_unix_timestamp!(.time, unit: "milliseconds")
'''

[sinks.opensearch]
type = "elasticsearch"
inputs = ["parse_ocsf"]
endpoints = ["https://opensearch:9200"]
mode = "bulk"
bulk.index = "torda-ocsf-%Y.%m.%d"
api_version = "v7"
[sinks.opensearch.auth]
strategy = "basic"
user = "torda-ingest"
password = "${OPENSEARCH_INGEST_PASSWORD}"
[sinks.opensearch.tls]
verify_certificate = false
[sinks.opensearch.healthcheck]
enabled = true

# --- Findings pipeline ------------------------------------------------------
[sources.findings]
type = "file"
include = ["/ingest/findings.ndjson"]
read_from = "beginning"

[transforms.parse_findings]
type = "remap"
inputs = ["findings"]
source = '''
. = parse_json!(.message)
.time = to_unix_timestamp(now(), unit: "milliseconds")
.@timestamp = from_unix_timestamp!(.time, unit: "milliseconds")
'''

[sinks.opensearch_findings]
type = "elasticsearch"
inputs = ["parse_findings"]
endpoints = ["https://opensearch:9200"]
mode = "bulk"
bulk.index = "torda-findings-%Y.%m.%d"
api_version = "v7"
[sinks.opensearch_findings.auth]
strategy = "basic"
user = "torda-ingest"
password = "${OPENSEARCH_INGEST_PASSWORD}"
[sinks.opensearch_findings.tls]
verify_certificate = false
[sinks.opensearch_findings.healthcheck]
enabled = true

# --- Remediation pipeline (fix-first queue) ---------------------------------
[sources.remediation]
type = "file"
include = ["/ingest/remediation.ndjson"]
read_from = "beginning"

[transforms.parse_remediation]
type = "remap"
inputs = ["remediation"]
source = '''
. = parse_json!(.message)
.closes_count = length(array!(.closes))
.assets_count = length(array!(.assets))
.time = to_unix_timestamp(now(), unit: "milliseconds")
.@timestamp = from_unix_timestamp!(.time, unit: "milliseconds")
'''

[sinks.opensearch_remediation]
type = "elasticsearch"
inputs = ["parse_remediation"]
endpoints = ["https://opensearch:9200"]
mode = "bulk"
bulk.index = "torda-remediation-%Y.%m.%d"
api_version = "v7"
[sinks.opensearch_remediation.auth]
strategy = "basic"
user = "torda-ingest"
password = "${OPENSEARCH_INGEST_PASSWORD}"
[sinks.opensearch_remediation.tls]
verify_certificate = false
[sinks.opensearch_remediation.healthcheck]
enabled = true
